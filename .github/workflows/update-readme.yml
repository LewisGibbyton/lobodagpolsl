name: Aktualizuj README z plikami CPP

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.cpp'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wygeneruj tabelę w README.md
        run: |
          echo "# Podstawy Programowania i ogólnego kodowania – lobodagpolsl" > README.md
          echo "" >> README.md
          echo "lista plików źródłowych C++:" >> README.md
          echo "" >> README.md
          echo "| Data ostatniej zmiany | Ścieżka do pliku (.cpp) |" >> README.md
          echo "| :--- | :--- |" >> README.md
          
          for file in $(find . -name "*.cpp" | sort); do
            clean_path=${file#./}
            date=$(git log -1 --format="%cd" --date=format:"%d.%m.%Y %H:%M" -- "$file")
            echo "|  $date | [ $clean_path](./$clean_path) |" >> README.md


          echo "$date Gabriel Łoboda" >> README.md
          done

      - name: Zapisz i wypchnij zmiany
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || git commit -m "Auto-update README.md z lista plikow .cpp"
          git push
